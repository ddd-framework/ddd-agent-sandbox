name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, intl
          coverage: none
          # Composer 2.9 refuses firebase/php-jwt 6.x (an advisory) which mgamadeus/ddd still requires
          tools: composer:2.8
      - run: composer install --no-interaction --no-progress --no-scripts
      - name: Lint
        run: find src config tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: vendor/bin/phpunit

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the runner's tests switch uids and use namespaces: they run as root in the Go image, as in the image build
      - name: go vet and go test
        run: |
          docker run --rm -v "$PWD/runner:/src" -w /src -e GOFLAGS=-buildvcs=false -e CGO_ENABLED=0 golang:1.27.4-trixie \
            sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 ./...'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      - run: pnpm build
