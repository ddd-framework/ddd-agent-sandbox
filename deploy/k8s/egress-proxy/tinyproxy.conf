Port 3128
Listen 0.0.0.0
Timeout 120
MaxClients 64
LogLevel Notice
# only the hosts of allowed-hosts.txt (one regular expression per line, anchored by the renderer)
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off
Filter "/etc/tinyproxy/allowed-hosts.txt"
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
